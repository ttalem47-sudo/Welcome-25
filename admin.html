<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الأدمن — B25</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0199E0;--bg:#0b1730;--card:#13264a;--line:#25417a;--red:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:Tajawal,system-ui,sans-serif;padding:0 0 60px}
header{position:sticky;top:0;z-index:20;background:rgba(11,23,48,.95);backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0 0 8px;font-size:19px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:10px 16px;border:0;border-radius:12px;background:var(--card);color:#9fc4ff;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff}
main{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:#9fc4ff;margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b1730;color:#fff;font:inherit;font-size:15px}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;color:#fff;background:var(--blue);cursor:pointer}
.btn.sm{padding:8px 11px;font-size:13px}.btn.gray{background:#2a4380}.btn.red{background:var(--red)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;gap:8px;align-items:center}
.th{width:72px;height:54px;border-radius:10px;background:#0b1730 center/cover;border:1px dashed var(--line);flex:none}
details{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
summary{padding:14px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
summary::after{content:"▾";margin-right:auto;opacity:.6}details[open] summary::after{content:"▴"}
.off{opacity:.55}
.body{padding:0 14px 14px}
.blk{background:#0f1f3d;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.blk .f{display:none}
.blk[data-type=text] .f-text,.blk[data-type=image] .f-image,.blk[data-type=location] .f-loc,.blk[data-type=link] .f-loc{display:block}
.blk[data-type=location] .f-label,.blk[data-type=link] .f-label{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gi{position:relative;aspect-ratio:1;border-radius:12px;background:#0b1730 center/cover;border:1px solid var(--line);cursor:pointer}
.gi button{position:absolute;bottom:4px;left:4px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
#modal>div{background:var(--bg);width:100%;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:#1db954;color:#fff;padding:11px 20px;border-radius:30px;font-weight:800;transition:transform .3s;z-index:70}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--red)}
.hint{font-size:13px;opacity:.65;margin:4px 0;line-height:1.7}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .it{flex:1;min-width:0}.item small{display:block;opacity:.65}
</style></head><body>
<header><h1>لوحة الأدمن</h1><div class="tabs"></div></header>
<main id="m"></main>
<div id="modal"><div></div></div><div id="toast"></div>
<script>
/* ===== B25 data layer: Supabase (table b25, row main) + local cache ===== */
const Store = (() => {
  const URL_ = 'https://wharntehlnmubyewcnsb.supabase.co';
  const KEY_ = 'sb_publishable_Yab8ELxvLOiQJggxhLAaAA_3pR6B0Z9';
  const KEY = 'b25data', AUTH = 'b25auth';
  const DEF = () => ({ images: [], home: { bg: null, interval: 5, title: 'أهلًا بدفعة B25' }, slides: [], services: [], notices: [], urgent: { on: false }, maint: { on: false, message: '' }, dialogs: { intro: '', home: '', hi: '' } });
  const norm = d => { d = d || {}; const b = DEF(); return { images: d.images || [], home: Object.assign(b.home, d.home || {}), slides: d.slides || [], services: d.services || [], notices: d.notices || [], urgent: d.urgent || b.urgent, maint: Object.assign(b.maint, d.maint || {}), dialogs: Object.assign(b.dialogs, d.dialogs || {}) }; };
  let cache = (() => { try { return norm(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return DEF(); } })();
  let timer = 0, pending = null, saving = false;
  const getAuth = () => { try { return JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch (e) { return null; } };
  const setAuth = a => { try { a ? localStorage.setItem(AUTH, JSON.stringify(a)) : localStorage.removeItem(AUTH); } catch (e) {} };
  const hdr = (token, extra) => Object.assign({ apikey: KEY_, 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}, extra || {});
  async function tokenCall(grant, body) {
    const r = await fetch(`${URL_}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: hdr(), body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || 'فشل الدخول');
    setAuth({ token: j.access_token, refresh: j.refresh_token });
    return j.access_token;
  }
  async function freshToken() { const a = getAuth(); if (!a) return null; try { return await tokenCall('refresh_token', { refresh_token: a.refresh }); } catch (e) { setAuth(null); return null; } }
  const err = m => { try { window.toast && window.toast(m, 1); } catch (e) {} };
  async function push(d) {
    const a = getAuth(); let t = a && a.token;
    const go = tk => fetch(`${URL_}/rest/v1/b25?id=eq.main`, { method: 'PATCH', headers: hdr(tk, { Prefer: 'return=minimal' }), body: JSON.stringify({ data: d, updated_at: new Date().toISOString() }) });
    let r = await go(t);
    if (r.status === 401 || r.status === 403) { t = await freshToken(); if (!t) throw new Error('سجّل الدخول من جديد'); r = await go(t); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
  }
  async function flush() {
    if (saving || !pending) return;
    saving = true; const d = pending; pending = null;
    try { await push(d); } catch (e) { err('فشل الحفظ على السيرفر: ' + e.message); }
    saving = false; if (pending) flush();
  }
  return {
    uid: () => Math.random().toString(36).slice(2, 9),
    load() { return cache; },
    save(d) { cache = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} pending = d; clearTimeout(timer); timer = setTimeout(flush, 500); return true; },
    async init() {
      try {
        const r = await fetch(`${URL_}/rest/v1/b25?id=eq.main&select=data`, { headers: hdr() });
        if (r.ok) {
          const rows = await r.json(), remote = rows[0] && rows[0].data;
          if (remote && Object.keys(remote).length) { cache = norm(remote); try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) {} }
          else if (getAuth() && (cache.images.length || cache.services.length || cache.slides.length)) { pending = cache; flush(); }
        }
      } catch (e) {}
      return cache;
    },
    async gate() {
      if (getAuth() && await freshToken()) return;
      return new Promise(res => {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;z-index:99;background:#0b1730;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Tajawal,sans-serif';
        const f = 'width:100%;padding:11px;margin:6px 0;border-radius:12px;border:1px solid #25417a;background:#0b1730;color:#fff;font:inherit';
        o.innerHTML = '<div style="width:100%;max-width:360px;background:#13264a;border:1px solid #25417a;border-radius:18px;padding:18px;color:#fff"><h3 style="margin:0 0 10px">دخول الأدمن</h3><input id="ge" type="email" dir="ltr" placeholder="الإيميل" style="' + f + '"><input id="gp" type="password" dir="ltr" placeholder="الباسورد" style="' + f + '"><p id="gm" style="color:#ff8a8d;font-size:13px;min-height:18px;margin:4px 0"></p><button id="gb" style="width:100%;padding:12px;border:0;border-radius:12px;background:#0199E0;color:#fff;font:inherit;font-weight:800">دخول</button></div>';
        document.body.appendChild(o);
        const go = async () => { const m = o.querySelector('#gm'); m.textContent = '...'; try { await tokenCall('password', { email: o.querySelector('#ge').value.trim(), password: o.querySelector('#gp').value }); o.remove(); res(); } catch (e) { m.textContent = 'خطأ: ' + e.message; } };
        o.querySelector('#gb').onclick = go;
        o.querySelector('#gp').onkeydown = e => { if (e.key === 'Enter') go(); };
      });
    },
    img(d, id) { const i = d.images.find(x => x.id == id); return i ? i.src : null; },
    compress(file, max = 1400, q = 0.72) {
      return new Promise((res, rej) => {
        const fr = new FileReader(); fr.onerror = rej;
        fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.src = fr.result; };
        fr.readAsDataURL(file);
      });
    }
  };
})();

</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=Store.load(),tab='home',open=new Set();
const th=id=>{const s=Store.img(D,id);return s?`style="background-image:url('${s}')"`:''};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',1800)}
function persist(msg='تم الحفظ'){Store.save(D);toast(msg)}
const picker=id=>`<div class="pick" data-id="${esc(id||'')}"><div class="th" ${th(id)}></div><button type="button" class="btn sm gray" data-a="pick">اختر صورة</button><button type="button" class="btn sm gray" data-a="clr">إزالة</button></div>`;
const val=el=>el.querySelector('.pick')?.dataset.id||null;
function choose(cb){const m=$('#modal');
  m.firstElementChild.innerHTML=`<h3>اختر صورة من المكتبة</h3>${D.images.length?`<div class="grid">${D.images.map(i=>`<div class="gi" data-id="${i.id}" style="background-image:url('${i.src}')"></div>`).join('')}</div>`:'<p class="hint">المكتبة فاضية، ارفع صور من تبويب المكتبة أولًا.</p>'}<div class="row"><button class="btn gray" id="cl">إغلاق</button></div>`;
  m.style.display='flex';
  m.onclick=e=>{const g=e.target.closest('.gi');if(g){cb(g.dataset.id);m.style.display='none'}else if(e.target===m||e.target.id==='cl')m.style.display='none'}}
const TABS=[['home','الرئيسية'],['services','الخدمات'],['notes','الإشعارات'],['ctrl','التحكم'],['dlg','الحوارات'],['lib','المكتبة']];
function render(){D=Store.load();
  $('.tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}"${t[0]===tab?' class="on"':''}>${t[1]}</button>`).join('');
  $('#m').innerHTML=({home:homeTab,services:servicesTab,notes:notesTab,ctrl:ctrlTab,dlg:dlgTab,lib:libTab})[tab]()}
const homeTab=()=>`<div class="card" data-k="home"><h3>الصفحة الرئيسية</h3>
<label>العنوان الترحيبي</label><input id="ht" value="${esc(D.home.title)}">
<label>خلفية الصفحة</label>${picker(D.home.bg)}
<label>سرعة تغيير الصور (بالثواني)</label><input type="number" min="2" max="60" id="iv" value="${+D.home.interval||5}">
<div class="row"><button class="btn" data-a="saveHome">حفظ</button></div></div>
<h3 style="margin:18px 4px 10px">صور النافذة الكبيرة (العرض المتغير)</h3>
${D.slides.map(s=>`<div class="card" data-k="slide" data-id="${s.id}">${picker(s.img)}<label>عنوان يظهر على الصورة (اختياري)</label><input class="cap" value="${esc(s.caption)}"><div class="row"><button class="btn" data-a="saveSlide">حفظ</button><button class="btn red" data-a="delSlide">حذف</button></div></div>`).join('')||'<p class="hint">ما في صور للعرض بعد.</p>'}
<div class="row"><button class="btn" data-a="addSlide">+ إضافة صورة للعرض</button></div>`;
const sel=(cls,v,opts)=>`<select class="${cls}">${opts.map(o=>`<option value="${o[0]}"${o[0]==v?' selected':''}>${o[1]}</option>`).join('')}</select>`;
const blockHtml=b=>`<div class="blk" data-k="blk" data-id="${b.id}" data-type="${b.type}">
<select data-a="type"><option value="text"${b.type=='text'?' selected':''}>نص</option><option value="image"${b.type=='image'?' selected':''}>صورة</option><option value="location"${b.type=='location'?' selected':''}>موقع</option><option value="link"${b.type=='link'?' selected':''}>رابط</option></select>
<div class="f f-text"><label>النص</label><textarea class="tx">${esc(b.text)}</textarea></div>
<div class="f f-image"><label>الصورة</label>${picker(b.img)}</div>
<div class="f f-label"><label>اسم الزر</label><input class="lb" value="${esc(b.label)}"></div>
<div class="f f-loc"><label>الرابط أو الموقع (رابط خرائط أو إحداثيات أو اسم المكان)</label><input class="ul" dir="ltr" value="${esc(b.url)}"></div>
<div class="row"><button class="btn sm" data-a="saveBlk">حفظ</button><button class="btn sm red" data-a="delBlk">حذف</button></div></div>`;
const servicesTab=()=>`${D.services.map((s,i)=>`<details data-k="svc" data-id="${s.id}"${open.has(s.id)?' open':''}><summary class="${s.active===false?'off':''}"><span>${esc(s.icon||'')}</span><span>${esc(s.title||'خدمة جديدة')}${s.active===false?' (مخفية)':''}</span></summary><div class="body">
<label>اسم الخدمة</label><input class="ti" value="${esc(s.title)}">
<div class="two"><div><label>أيقونة (رمز أو إيموجي)</label><input class="ic" value="${esc(s.icon)}" maxlength="4"></div>
<div><label>الحالة</label>${sel('sa',s.active===false?'0':'1',[['1','ظاهرة'],['0','مخفية']])}</div></div>
<div class="two"><div><label>شكل البطاقة</label>${sel('sm',s.mode||'both',[['both','أيقونة ونص'],['icon','أيقونة فقط'],['text','نص فقط']])}</div>
<div><label>نوع الخدمة</label>${sel('sk',s.kind||'page',[['page','صفحة (نص وصور)'],['link','رابط خارجي']])}</div></div>
<label>الرابط (للرابط الخارجي فقط)</label><input class="su" dir="ltr" value="${esc(s.url)}" placeholder="https://...">
<label>خلفية صفحة الخدمة والمربع</label>${picker(s.bg)}
<label>حوار الشخصيات عند فتح الخدمة (اختياري)</label><textarea class="dl" placeholder="ش: أهلًا بكم في هذه الخدمة&#10;ا: تفضلوا استكشفوا">${esc(s.dlg)}</textarea>
<p class="hint">كل سطر جملة. ابدأ بـ ش: لشوبيتو، أو بـ ا: لإبراهيم، والسطر بلا بادئة يتكلم به إبراهيم. إذا تركته فارغًا يُستخدم الحوار الافتراضي.</p>
<div class="row"><button class="btn" data-a="saveSvc">حفظ الخدمة</button><button class="btn gray" data-a="up"${i?'':' disabled'}>للأعلى</button><button class="btn gray" data-a="dn"${i<D.services.length-1?'':' disabled'}>للأسفل</button><button class="btn red" data-a="delSvc">حذف</button></div>
<h3 style="margin:18px 0 0;font-size:15px">محتوى الصفحة</h3>
<div class="bl">${(s.blocks||[]).map(blockHtml).join('')||'<p class="hint">ما في محتوى بعد، أضف أي مزيج من النص والصور والموقع والروابط.</p>'}</div>
<div class="row"><button class="btn sm gray" data-a="addBlk" data-ty="text">+ نص</button><button class="btn sm gray" data-a="addBlk" data-ty="image">+ صورة</button><button class="btn sm gray" data-a="addBlk" data-ty="location">+ موقع</button><button class="btn sm gray" data-a="addBlk" data-ty="link">+ رابط</button></div>
</div></details>`).join('')||'<p class="hint">ما في خدمات بعد.</p>'}
<div class="row"><button class="btn" data-a="addSvc">+ إضافة خدمة</button></div>`;
const notesTab=()=>`<div class="card"><h3>إشعار جديد</h3><label>العنوان (اختياري)</label><input id="nt"><label>النص</label><textarea id="nb"></textarea><div class="row"><button class="btn" data-a="addNote">نشر للجميع</button></div></div>
${(D.notices||[]).map(n=>`<div class="card" data-k="note" data-id="${n.id}"><b>${esc(n.title||'إشعار')}</b><p class="hint" style="white-space:pre-wrap">${esc(n.body)}</p><small class="hint">${esc((n.date||'').slice(0,10))}</small><div class="row"><button class="btn sm red" data-a="delNote">حذف</button></div></div>`).join('')||'<p class="hint">لا توجد إشعارات.</p>'}`;
const ctrlTab=()=>{const m=D.maint||{},u=D.urgent||{},live=u.on&&(!u.expires||new Date(u.expires)>new Date());return `<div class="card"><h3>وضع الصيانة</h3><p class="hint">عند التفعيل يرى الزوار رسالة الصيانة بدل الصفحة الرئيسية. لوحة الأدمن تبقى تعمل.</p>
${sel('',m.on?'1':'0',[['0','متوقف'],['1','مفعّل']]).replace('<select class="">','<select id="mo">')}<label>رسالة الصيانة</label><textarea id="mm">${esc(m.message)}</textarea><div class="row"><button class="btn" data-a="saveMaint">حفظ</button></div></div>
<div class="card"><h3>إشعار عاجل</h3><p class="hint">${live?'منشور الآن: '+esc(u.title):'لا يوجد إشعار عاجل منشور حاليًا.'}</p>
<label>العنوان</label><input id="ut" value=""><label>النص</label><textarea id="ub"></textarea>
<label>مدة الظهور</label><select id="ud"><option value="1">ساعة</option><option value="6">6 ساعات</option><option value="24" selected>يوم</option><option value="72">3 أيام</option><option value="0">حتى أوقفه</option></select>
<div class="row"><button class="btn" data-a="pubUrgent">نشر</button><button class="btn red" data-a="stopUrgent">إيقاف</button></div></div>`};
const dlgTab=()=>{const g=D.dialogs||{};return `<div class="card"><h3>حوارات إبراهيم وشوبيتو</h3><p class="hint">كل سطر جملة. ابدأ بـ ش: لشوبيتو، أو بـ ا: لإبراهيم. اترك الحقل فارغًا لاستخدام الحوار الافتراضي.</p>
<label>حوار الافتتاح (بعد فتح القفل)</label><textarea id="di" placeholder="ا: أهلًا وسهلًا بدفعة B25&#10;ش: وأنا شوبيتو">${esc(g.intro)}</textarea>
<label>حوارات الصفحة الرئيسية (افصل بين كل حوار وآخر بسطر فارغ)</label><textarea id="dh" style="min-height:140px">${esc(g.home)}</textarea>
<label>عبارات ترحيب قصيرة (سطر لكل عبارة)</label><textarea id="dw">${esc(g.hi)}</textarea>
<div class="row"><button class="btn" data-a="saveDlg">حفظ</button></div></div>`};
const libTab=()=>`<div class="card"><h3>رفع صور</h3><input type="file" id="up" accept="image/*" multiple><p class="hint">الصور بتتصغّر تلقائيًا. بعد الرفع تقدر تختارها للخلفيات والعرض والخدمات.</p></div>
<div class="grid">${D.images.map(i=>`<div class="gi" style="background-image:url('${i.src}')"><button class="btn sm red" data-a="delImg" data-id="${i.id}">حذف</button></div>`).join('')}</div>`;
$('.tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render()}};
$('#m').addEventListener('change',async e=>{
  if(e.target.id==='up'){let n=0;for(const f of e.target.files){try{D.images.push({id:Store.uid(),src:await Store.compress(f)});n++}catch(x){}}persist(`تم رفع ${n} صورة`);render()}
  if(e.target.dataset.a==='type'){e.target.closest('.blk').dataset.type=e.target.value}});
$('#m').addEventListener('click',e=>{
  const bt=e.target.closest('[data-a]');if(!bt||bt.tagName==='SELECT')return;
  const a=bt.dataset.a,box=bt.closest('[data-k]'),id=box?.dataset.id;
  const svc=()=>D.services.find(x=>x.id==bt.closest('[data-k=svc]')?.dataset.id);
  const q=(s)=>box.querySelector(s);
  if(a==='pick'){const p=bt.closest('.pick');choose(i=>{p.dataset.id=i;p.querySelector('.th').style.backgroundImage=`url('${Store.img(D,i)}')`})}
  else if(a==='clr'){const p=bt.closest('.pick');p.dataset.id='';p.querySelector('.th').style.backgroundImage=''}
  else if(a==='saveHome'){D.home.bg=val(box);D.home.title=$('#ht').value.trim();D.home.interval=Math.min(60,Math.max(2,+$('#iv').value||5));persist()}
  else if(a==='addSlide'){D.slides.push({id:Store.uid(),img:null,caption:''});persist('تمت الإضافة');render()}
  else if(a==='saveSlide'){const s=D.slides.find(x=>x.id==id);s.img=val(box);s.caption=q('.cap').value;persist()}
  else if(a==='delSlide'){if(confirm('حذف هذه الصورة من العرض؟')){D.slides=D.slides.filter(x=>x.id!=id);persist('تم الحذف');render()}}
  else if(a==='addSvc'){const n=Store.uid();D.services.push({id:n,title:'',icon:'◆',bg:null,kind:'page',url:'',mode:'both',active:true,dlg:'',blocks:[]});open.add(n);persist('تمت الإضافة');render()}
  else if(a==='saveSvc'){const s=svc();s.title=q('.ti').value;s.icon=q('.ic').value;s.active=q('.sa').value==='1';s.mode=q('.sm').value;s.kind=q('.sk').value;s.url=q('.su').value.trim();s.dlg=q('.dl').value;s.bg=val(box);persist();open.add(s.id);render()}
  else if(a==='delSvc'){if(confirm('حذف الخدمة بكل محتواها؟')){D.services=D.services.filter(x=>x.id!=id);persist('تم الحذف');render()}}
  else if(a==='up'||a==='dn'){const i=D.services.findIndex(x=>x.id==id),j=a==='up'?i-1:i+1;if(j>=0&&j<D.services.length){const t=D.services[i];D.services[i]=D.services[j];D.services[j]=t;open.add(id);persist('تم التحريك');render()}}
  else if(a==='addBlk'){const s=svc();s.blocks=s.blocks||[];s.blocks.push({id:Store.uid(),type:bt.dataset.ty,text:'',img:null,label:'',url:''});persist('تمت الإضافة');open.add(s.id);render()}
  else if(a==='saveBlk'){const s=svc(),b=s.blocks.find(x=>x.id==id);b.type=box.dataset.type;b.text=q('.tx').value;b.img=val(box);b.label=q('.lb').value;b.url=q('.ul').value;persist()}
  else if(a==='delBlk'){if(confirm('حذف هذا العنصر؟')){const s=svc();s.blocks=s.blocks.filter(x=>x.id!=id);persist('تم الحذف');open.add(s.id);render()}}
  else if(a==='delImg'){if(confirm('حذف الصورة من المكتبة؟ بتنشال من كل مكان مستخدمة فيه.')){const i=bt.dataset.id;D.images=D.images.filter(x=>x.id!=i);if(D.home.bg==i)D.home.bg=null;D.slides.forEach(s=>{if(s.img==i)s.img=null});D.services.forEach(s=>{if(s.bg==i)s.bg=null;(s.blocks||[]).forEach(b=>{if(b.img==i)b.img=null})});persist('تم الحذف');render()}}
  else if(a==='addNote'){const b=$('#nb').value.trim();if(!b){toast('اكتب نص الإشعار',1);return}D.notices=D.notices||[];D.notices.unshift({id:Store.uid(),title:$('#nt').value.trim(),body:b,date:new Date().toISOString()});persist('تم النشر');render()}
  else if(a==='delNote'){if(confirm('حذف الإشعار؟')){D.notices=D.notices.filter(x=>x.id!=id);persist('تم الحذف');render()}}
  else if(a==='saveMaint'){const on=$('#mo').value==='1';if(on&&!confirm('سيرى الزوار رسالة الصيانة بدل الموقع. متابعة؟'))return;D.maint={on,message:$('#mm').value.trim()};persist(on?'تم تفعيل الصيانة':'تم الحفظ')}
  else if(a==='pubUrgent'){const t=$('#ut').value.trim(),b=$('#ub').value.trim();if(!t||!b){toast('اكتب العنوان والنص',1);return}const h=+$('#ud').value;D.urgent={on:true,id:Store.uid(),title:t,body:b,expires:h?new Date(Date.now()+h*3600000).toISOString():null};persist('تم نشر الإشعار العاجل');render()}
  else if(a==='stopUrgent'){D.urgent={on:false};persist('تم الإيقاف');render()}
  else if(a==='saveDlg'){D.dialogs={intro:$('#di').value,home:$('#dh').value,hi:$('#dw').value};persist()}
});
$('#m').addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'){d.open?open.add(d.dataset.id):open.delete(d.dataset.id)}},true);
Store.gate().then(()=>Store.init()).then(render);
</script></body></html>
