<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>أهلًا بدفعة B25</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1730;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:fixed;inset:0;width:100%}
html,body{height:100%;margin:0;overflow:hidden;max-width:100%;background:#050b17;font-family:Tajawal,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
/* ---------- الصفحة الرئيسية (مدمجة) ---------- */
#home{position:absolute;inset:0;z-index:1;background:#0b1730;color:#fff;visibility:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:right;user-select:text}
#hbg{position:fixed;inset:0;background:#0b1730 center/cover no-repeat;z-index:0}

#hc{position:relative;z-index:1;max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px 170px}

#pg::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(11,23,48,.6),rgba(11,23,48,.88));pointer-events:none}

#pgc h1{margin:18px 0 12px;font-size:25px;text-align:center}
.bt{white-space:pre-wrap;line-height:1.9;font-size:16px;background:rgba(19,38,74,.72);border:1px solid #25417a;border-radius:16px;padding:14px;margin:10px 0}
.bi{display:block;width:100%;border-radius:16px;margin:10px 0;border:1px solid #25417a}
.bl{display:block;text-align:center;text-decoration:none;color:#fff;background:#0199E0;font-weight:800;border-radius:14px;padding:13px;margin:10px 0}
/* ---------- المقدمة ---------- */
#re{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:40;border:0;border-radius:50%;width:38px;height:38px;background:rgba(30,159,228,.35);color:#fff;font-size:20px;cursor:pointer;display:none}
#room{position:absolute;inset:0;z-index:2;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(60,150,255,.2),transparent 55%),linear-gradient(#142949,#0b1730 72%)}

.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.75));pointer-events:none}

@keyframes shake{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
@keyframes flick{0%,100%{filter:none}12%{filter:brightness(.3)}26%{filter:brightness(1.5)}40%{filter:brightness(.4)}55%{filter:brightness(1.2)}70%{filter:brightness(.25)}85%{filter:none}}
#room .o{position:absolute;left:0;top:0;opacity:0}

#c2{border-style:dotted;border-color:#fff}

#flash{position:fixed;left:50%;top:30%;pointer-events:none;width:100px;height:100px;margin:-50px;border-radius:50%;background:#0b1730;transform:scale(0);z-index:3;transition:transform 1s ease-in}
#gl{position:fixed;left:0;top:0;z-index:30;pointer-events:none}
#fx{position:fixed;inset:0;z-index:35;pointer-events:none}
.pt{position:absolute;width:6px;height:6px;border-radius:50%;background:#bfe3ff;box-shadow:0 0 8px #3aa7ff}
.rg{position:absolute;width:100px;height:100px;border:3px solid #7cc8ff;border-radius:50%}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#9fd2ff;font-weight:800;font-size:20px;background:rgba(5,11,23,.6);transition:opacity .5s;cursor:pointer}
#start b{width:54px;height:54px;border:3px solid #7cc8ff;border-radius:50%;animation:pulse 1.4s infinite}

:root{--blue:#0199E0;--line:#D9E1EA}

.sb .ear{fill:#fff;stroke:var(--line);stroke-width:1.5}.sb .ea2{fill:var(--blue);stroke:none}
.sb .dot{fill:#0B1B33;opacity:.5;stroke:none}.sb .sh{fill:rgba(0,0,0,.2);stroke:none;transform-origin:center;animation:shf 2.8s ease-in-out infinite}.sb .gl{fill:var(--blue);stroke:none;opacity:.35;transform-origin:center;animation:glp 1.4s ease-in-out infinite}
.sb .ex{display:none}
.sb[data-e=neutral] .ex-neutral,.sb[data-e=happy] .ex-happy,.sb[data-e=laugh] .ex-laugh,.sb[data-e=shock] .ex-shock,.sb[data-e=sleepy] .ex-sleepy,.sb[data-e=love] .ex-love,.sb[data-e=wink] .ex-wink,.sb[data-e=sad] .ex-sad{display:block}
.talk .sb .ex{display:none!important}.talk .sb .ex-talk{display:block!important}
.sb .eye,.sb .fl,.sb .mouth{fill:var(--blue);stroke:none}
.sb .ln{fill:none;stroke:var(--blue);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sb .hl{fill:#fff;stroke:none}
.sb .eye{transform-origin:center;animation:blink 4.2s infinite}
.sb .tm{transform-origin:center;animation:mouth .2s ease-in-out infinite alternate}

.sb .fi{transform:translate(calc(var(--lx,0)*4px),calc(var(--ly,0)*3px));transition:transform .15s}
.sb-head{transform:translate(calc(var(--lx,0)*1.6px),calc(var(--ly,0)*1px)) rotate(var(--hr,0deg));transform-origin:50% 100%;transition:transform .25s}
.sleep{--hr:8deg}
.sb .zz{display:none}.sleep .sb .zz{display:block}
.sb .z{font-size:13px;font-weight:700;fill:var(--blue);stroke:none;opacity:0;animation:zz 2.4s ease-in-out infinite}
.sb .z2{animation-delay:.6s}.sb .z3{animation-delay:1.2s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.sb-w{transform-origin:50% 100%;animation:flt 2.8s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(-9px) rotate(-1.2deg)}50%{transform:translateY(-16px) rotate(1.2deg)}}
@keyframes shf{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.55}}
@keyframes glp{50%{opacity:.62;transform:scaleX(1.25)}}
.sb.ho .sb-w{animation:hbob 3s ease-in-out infinite}@keyframes hbob{50%{transform:translateY(-3px)}}
.arm.l{transform-box:view-box;transform-origin:31px 90px;animation:asl 3.4s ease-in-out infinite}
.arm.r{transform-box:view-box;transform-origin:89px 90px;animation:asr 3.4s ease-in-out infinite}
@keyframes asl{50%{transform:rotate(11deg)}}@keyframes asr{50%{transform:rotate(-11deg)}}
.walk .sb-w{animation:fly .7s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(-10px) rotate(calc(var(--dir,1)*7deg))}50%{transform:translateY(-17px) rotate(calc(var(--dir,1)*9deg))}}
.walk .gl{animation:glp .35s ease-in-out infinite;opacity:.55}
.walk .arm.l{animation:fl .26s ease-in-out infinite}.walk .arm.r{animation:fr .26s ease-in-out infinite}
@keyframes fl{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-6deg)}}@keyframes fr{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(6deg)}}
.wave .arm.r{animation:wv .5s ease-in-out 4}
@keyframes wv{0%,100%{transform:rotate(-125deg)}50%{transform:rotate(-168deg)}}
.hop .sb-w{animation:hop .7s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%,100%{transform:translateY(-9px)}40%{transform:translateY(-34px) scaleY(1.05)}72%{transform:translateY(-12px) scaleY(.96)}}
.hop .sh{animation:shh .7s}@keyframes shh{40%{transform:scale(.55);opacity:.3}}
.drag .sb-w{animation:none;transform:translateY(-18px) rotate(-4deg)}.drag .sh{animation:none;transform:scale(.6);opacity:.4}
.drag .arm.l{animation:none;transform:rotate(150deg)}.drag .arm.r{animation:none;transform:rotate(-150deg)}
.dance .sb-w{animation:dance .55s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-9deg) translateY(-10px)}50%{transform:rotate(9deg) translateY(-24px)}}
.dance .arm.l{animation:cl .55s ease-in-out infinite}.dance .arm.r{animation:cr .55s ease-in-out infinite}
@keyframes cl{0%,100%{transform:rotate(125deg)}50%{transform:rotate(170deg)}}@keyframes cr{0%,100%{transform:rotate(-170deg)}50%{transform:rotate(-125deg)}}
.sleep .sb-w{animation:flz 5.5s ease-in-out infinite}@keyframes flz{0%,100%{transform:translateY(-4px)}50%{transform:translateY(-8px)}}.sleep .gl{opacity:.15;animation:none}
</style></head><body>

<!-- طبقة البيانات (قراءة فقط) — Supabase + كاش محلي، نفس مفتاح الكاش المستخدم في admin.html -->
<script>
const Store = (() => {
  const URL_ = 'https://wharntehlnmubyewcnsb.supabase.co';
  const KEY_ = 'sb_publishable_Yab8ELxvLOiQJggxhLAaAA_3pR6B0Z9';
  const KEY = 'b25data';
  const DEF = () => ({ images: [], home: { bg: null, interval: 5 }, slides: [], services: [] });
  const norm = d => { d = d || {}; const b = DEF(); return { images: d.images || [], home: Object.assign(b.home, d.home || {}), slides: d.slides || [], services: d.services || [] }; };
  let cache = (() => { try { return norm(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return DEF(); } })();
  return {
    load() { return cache; },
    async init() {
      try {
        const r = await fetch(`${URL_}/rest/v1/b25?id=eq.main&select=data`, { headers: { apikey: KEY_ } });
        if (r.ok) {
          const rows = await r.json(), remote = rows[0] && rows[0].data;
          if (remote && Object.keys(remote).length) { cache = norm(remote); try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) {} }
        }
      } catch (e) { /* أوفلاين: نستخدم الكاش */ }
      return cache;
    },
    img(d, id) { const i = d.images.find(x => x.id == id); return i ? i.src : null; }
  };
})();
</script>

<!-- منطق الصفحة الرئيسية -->
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=Store.load(),slTimer=0,svOpen=false;
const bg=id=>{const s=Store.img(D,id);return s?`background-image:url('${s}')`:''};
function mapHref(u){u=(u||'').trim();if(!u)return '';
  if(/^(javascript|data|vbscript):/i.test(u))return '';
  if(/^https?:\/\//i.test(u))return u;
  const m=u.match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
  if(m)return `https://www.google.com/maps?q=${m[1]},${m[2]}`;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(u)}
function linkHref(u){u=(u||'').trim();if(!u)return '';
  if(/^(https?:|mailto:|tel:)/i.test(u))return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';
  return 'https://'+u}
function renderHome(){
  D=Store.load();
  const bgs=Store.img(D,D.home.bg);
  document.getElementById('hbg').style.backgroundImage=bgs?`url('${bgs}')`:'none';
  /* العرض المتغير */
  const sl=document.getElementById('sl'),slides=D.slides.filter(s=>Store.img(D,s.img));
  clearInterval(slTimer);
  if(!slides.length){sl.style.display='none'}
  else{
    sl.style.display='block';
    sl.innerHTML=slides.map((s,i)=>`<div class="sld${i?'':' on'}" style="${bg(s.img)}">${s.caption?`<div class="cp">${esc(s.caption)}</div>`:''}</div>`).join('')+(slides.length>1?`<div class="dots">${slides.map((_,i)=>`<i${i?'':' class="on"'}></i>`).join('')}</div>`:'');
    if(slides.length>1){let i=0;const els=sl.querySelectorAll('.sld'),ds=sl.querySelectorAll('.dots i');
      slTimer=setInterval(()=>{els[i].classList.remove('on');ds[i].classList.remove('on');i=(i+1)%els.length;els[i].classList.add('on');ds[i].classList.add('on')},(+D.home.interval||5)*1000)}
  }
  /* الخدمات */
  const sv=document.getElementById('sv');
  sv.innerHTML=D.services.length?D.services.map(s=>`<div class="tile" data-id="${esc(s.id)}" style="${bg(s.bg)}"><span class="ic">${esc(s.icon||'✨')}</span><span class="tt">${esc(s.title||'خدمة')}</span></div>`).join(''):'<p class="empty" style="grid-column:1/-1">الخدمات قريبًا ✨</p>';
}
function blockHtml(b){
  if(b.type==='text')return b.text?`<div class="bt">${esc(b.text)}</div>`:'';
  if(b.type==='image'){const s=Store.img(D,b.img);return s?`<img class="bi" src="${s}" alt="">`:''}
  if(b.type==='location'){const h=mapHref(b.url);return h?`<a class="bl" target="_blank" rel="noopener" href="${esc(h)}">📍 ${esc(b.label||'افتح الموقع')}</a>`:''}
  if(b.type==='link'){const h=linkHref(b.url);return h?`<a class="bl" target="_blank" rel="noopener" href="${esc(h)}">🔗 ${esc(b.label||'افتح الرابط')}</a>`:''}
  return ''}
function openSvc(id,fromPop){
  const s=D.services.find(x=>x.id==id);if(!s)return;
  const pg=document.getElementById('pg'),c=document.getElementById('pgc');
  pg.style.backgroundImage=Store.img(D,s.bg)?`url('${Store.img(D,s.bg)}')`:'none';
  c.innerHTML=`<button id="bk">→ رجوع</button><h1>${esc(s.icon||'')} ${esc(s.title||'')}</h1>${(s.blocks||[]).map(blockHtml).join('')||'<p class="empty">المحتوى قريبًا</p>'}`;
  pg.scrollTop=0;pg.classList.add('show');svOpen=true;
  document.getElementById('bot').style.opacity=0;
  if(!fromPop)try{history.pushState({svc:id},'')}catch(e){}
}
function closeSvc(){
  document.getElementById('pg').classList.remove('show');svOpen=false;
  if(ready)document.getElementById('bot').style.opacity=1;
}
document.getElementById('sv').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openSvc(t.dataset.id)});
document.getElementById('pg').addEventListener('click',e=>{if(e.target.closest('#bk')){if(history.state&&history.state.svc){history.back()}else closeSvc()}});
window.addEventListener('popstate',()=>{if(svOpen)closeSvc()});
renderHome();
Store.init().then(renderHome);
</script>

<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const W=innerWidth,H=innerHeight,BS=Math.min(1,H/760,W/390);
let B={x:0,y:0,s:1},busy=true,ready=false;
const room=$('#room'),home=$('#home'),fx=$('#fx'),sh=$('#sh'),lsh=$('#lsh'),c1=$('#c1'),c2=$('#c2');
[[sh,150,26],[lsh,90,18],[c1,100,100],[c2,50,50]].forEach(([e,w,h])=>{e._w=w;e._h=h});
function put(el,x,y,s=1,r=0,ms=0,ease='cubic-bezier(.4,0,.2,1)'){el.style.transition=ms?`transform ${ms}ms ${ease},opacity ${ms}ms`:'none';void el.offsetWidth;el.style.transform=`translate(${x-el._w/2}px,${y-el._h/2}px) rotate(${r}deg) scale(${s})`;return sleep(ms)}
/* ---------- sound ---------- */
let AC,drn,ostI;

function tn(f,t=0,d=.3,ty='sine',v=.15,f2){try{const a=A(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
