async function scene(L,g,s=.85){for(const l0 of L){if(g!=gen)return;const l=nl(l0),a=l.w=='s'?SB:IB,o=a==IB?SB:IB,c=spot(),lx=c.x+(c.x<W/2?1:-1)*Math.min(140,W*.36);
 o.mood('n');await Promise.all([a.go(c.x,c.y,s),o.go(lx,Math.min(H-80,Math.max(200,c.y+rnd(-40,40))),s)]);if(g!=gen)return;
 a.face(lx-c.x);o.face(c.x-lx);look(a==SB?lx:c.x,c.y);await say(a,l.t,l.m);look()}}

function linesFor(k,d){if(d&&d.lines&&d.lines.length)return d.lines;k=String(k||'').trim();const V=D.svc;return V[k]||V[AL[k]]||V[Object.keys(V).find(n=>n!='default'&&k&&(k.includes(n)||n.includes(k)))]||V.default}

window.B24Cast={service:svc,home(){homeLoop(++gen)},dialogs:D,setDialogs(j){if(!j)return;['intro','home','hi'].forEach(k=>{if(j[k])D[k]=j[k]});if(j.svc)Object.assign(D.svc,j.svc)}};
addEventListener('message',e=>{const d=e.data;if(d&&d.b24=='service')svc(d.name||d.id,d);else if(d&&d.b24=='home')B24Cast.home()});

/* ===== B25 data layer: Supabase (table b25, row main) + local cache ===== */
const Store = (() => {
  const URL_ = 'https://wharntehlnmubyewcnsb.supabase.co';
  const KEY_ = 'sb_publishable_Yab8ELxvLOiQJggxhLAaAA_3pR6B0Z9';
  const KEY = 'b25data', AUTH = 'b25auth';
  const DEF = () => ({ images: [], home: { bg: null, interval: 5, title: 'أهلًا بدفعة B25' }, slides: [], services: [], notices: [], urgent: { on: false }, maint: { on: false, message: '' }, dialogs: { intro: '', home: '', hi: '' } });
  const norm = d => { d = d || {}; const b = DEF(); return { images: d.images || [], home: Object.assign(b.home, d.home || {}), slides: d.slides || [], services: d.services || [], notices: d.notices || [], urgent: d.urgent || b.urgent, maint: Object.assign(b.maint, d.maint || {}), dialogs: Object.assign(b.dialogs, d.dialogs || {}) }; };
  let cache = (() => { try { return norm(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return DEF(); } })();
  let timer = 0, pending = null, saving = false;
  const getAuth = () => { try { return JSON.parse(localStorage.getItem(AUTH) || 'null'); } catch (e) { return null; } };
  const setAuth = a => { try { a ? localStorage.setItem(AUTH, JSON.stringify(a)) : localStorage.removeItem(AUTH); } catch (e) {} };
  const hdr = (token, extra) => Object.assign({ apikey: KEY_, 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}, extra || {});
  async function tokenCall(grant, body) {
    const r = await fetch(`${URL_}/auth/v1/token?grant_type=${grant}`, { method: 'POST', headers: hdr(), body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || 'فشل الدخول');
    setAuth({ token: j.access_token, refresh: j.refresh_token });
    return j.access_token;
  }
  async function freshToken() { const a = getAuth(); if (!a) return null; try { return await tokenCall('refresh_token', { refresh_token: a.refresh }); } catch (e) { setAuth(null); return null; } }
  const err = m => { try { window.toast && window.toast(m, 1); } catch (e) {} };
  async function push(d) {
    const a = getAuth(); let t = a && a.token;
    const go = tk => fetch(`${URL_}/rest/v1/b25?id=eq.main`, { method: 'PATCH', headers: hdr(tk, { Prefer: 'return=minimal' }), body: JSON.stringify({ data: d, updated_at: new Date().toISOString() }) });
    let r = await go(t);
    if (r.status === 401 || r.status === 403) { t = await freshToken(); if (!t) throw new Error('سجّل الدخول من جديد'); r = await go(t); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
  }
  async function flush() {
    if (saving || !pending) return;
    saving = true; const d = pending; pending = null;
    try { await push(d); } catch (e) { err('فشل الحفظ على السيرفر: ' + e.message); }
    saving = false; if (pending) flush();
  }
  return {
    uid: () => Math.random().toString(36).slice(2, 9),
    load() { return cache; },
    save(d) { cache = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} pending = d; clearTimeout(timer); timer = setTimeout(flush, 500); return true; },
    async init() {
      try {
        const r = await fetch(`${URL_}/rest/v1/b25?id=eq.main&select=data`, { headers: hdr() });
        if (r.ok) {
          const rows = await r.json(), remote = rows[0] && rows[0].data;
          if (remote && Object.keys(remote).length) { cache = norm(remote); try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch (e) {} }
          else if (getAuth() && (cache.images.length || cache.services.length || cache.slides.length)) { pending = cache; flush(); }
        }
      } catch (e) {}
      return cache;
    },
    async gate() {
      if (getAuth() && await freshToken()) return;
      return new Promise(res => {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;z-index:99;background:#0b1730;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Tajawal,sans-serif';
        const f = 'width:100%;padding:11px;margin:6px 0;border-radius:12px;border:1px solid #25417a;background:#0b1730;color:#fff;font:inherit';
        o.innerHTML = '<div style="width:100%;max-width:360px;background:#13264a;border:1px solid #25417a;border-radius:18px;padding:18px;color:#fff"><h3 style="margin:0 0 10px">دخول الأدمن</h3><input id="ge" type="email" dir="ltr" placeholder="الإيميل" style="' + f + '"><input id="gp" type="password" dir="ltr" placeholder="الباسورد" style="' + f + '"><p id="gm" style="color:#ff8a8d;font-size:13px;min-height:18px;margin:4px 0"></p><button id="gb" style="width:100%;padding:12px;border:0;border-radius:12px;background:#0199E0;color:#fff;font:inherit;font-weight:800">دخول</button></div>';
        document.body.appendChild(o);
        const go = async () => { const m = o.querySelector('#gm'); m.textContent = '...'; try { await tokenCall('password', { email: o.querySelector('#ge').value.trim(), password: o.querySelector('#gp').value }); o.remove(); res(); } catch (e) { m.textContent = 'خطأ: ' + e.message; } };
        o.querySelector('#gb').onclick = go;
        o.querySelector('#gp').onkeydown = e => { if (e.key === 'Enter') go(); };
      });
    },
    img(d, id) { const i = d.images.find(x => x.id == id); return i ? i.src : null; },
    compress(file, max = 1400, q = 0.72) {
      return new Promise((res, rej) => {
        const fr = new FileReader(); fr.onerror = rej;
        fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.src = fr.result; };
        fr.readAsDataURL(file);
      });
    }
  };
})();

/* ===== inline home page (replaces home.html) ===== */
const hq=s=>document.querySelector(s);
const hesc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hurl=u=>{u=String(u||'').trim();if(!u)return'#';return /^(https?:|tel:|mailto:)/i.test(u)?u:'https://'+u.replace(/^\/+/,'')};
const hmap=v=>{v=String(v||'').trim();if(/^https?:/i.test(v))return v;if(/^[\w.-]+\.[a-z]{2,}\/\S*$/i.test(v))return'https://'+v;return'https://www.google.com/maps?q='+encodeURIComponent(v)};
const hcss=src=>src?`url('${src}')`:'';
const hdate=s=>{try{return new Date(s).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})}catch(e){return''}};
let HD,htimer=0,hcur=0,hsig='',hInSvc=false;
function parseLines(txt){return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(ش|ا|إ)\s*[:：]\s*(.+)$/);if(!m)return{w:'i',t:l,m:'h'};const s=m[1]=='ش';return{w:s?'s':'i',t:m[2],m:s?'h':'l'}})}
function applyDialogs(){try{const g=Store.load().dialogs||{},j={},i=parseLines(g.intro);if(i.length)j.intro=i;
 const h=String(g.home||'').split(/\n\s*\n/).map(parseLines).filter(x=>x.length);if(h.length)j.home=h;
 const hi=String(g.hi||'').split('\n').map(x=>x.trim()).filter(Boolean);if(hi.length)j.hi=hi;B24Cast.setDialogs(j)}catch(e){}}
function castSvc(name,dlg){try{if(ready&&window.B24Cast){const l=parseLines(dlg);B24Cast.service(name,l.length?{lines:l}:{})}}catch(e){}}
function hrender(){
 HD=Store.load();
 const sig=JSON.stringify(HD)+location.hash;if(sig===hsig)return;hsig=sig;
 clearInterval(htimer);
 const mt=hq('#hmt');if(mt)mt.remove();
 if(HD.maint&&HD.maint.on){hq('#hbg').style.backgroundImage='';hq('#happ').innerHTML='';const d=document.createElement('div');d.id='hmt';d.textContent=HD.maint.message||'التطبيق تحت الصيانة حاليًا، نعود قريبًا';hq('#home').appendChild(d);return}
 const m=location.hash.match(/^#s=(.+)$/),s=m&&HD.services.find(x=>x.id==m[1]&&x.active!==false);
 if(s){hInSvc=true;hservice(s)}else{if(hInSvc){hInSvc=false;if(ready)try{B24Cast.home()}catch(e){}}hhome()}
}
function hhome(){
 hq('#hbg').style.backgroundImage=hcss(Store.img(HD,HD.home.bg))||'';
 const slides=HD.slides.map(x=>({src:Store.img(HD,x.img),cap:x.caption})).filter(x=>x.src);hcur=0;
 const u=HD.urgent||{},live=u.on&&(!u.expires||new Date(u.expires)>new Date());let dis=false;try{dis=localStorage.getItem('b25u')==u.id}catch(e){}
 const sv=HD.services.filter(x=>x.active!==false);
 const nt=(HD.notices||[]).slice(0,10);
 hq('#happ').innerHTML=(live&&!dis?`<div class="hurg"><button data-hx="${hesc(u.id)}">إغلاق</button><b>${hesc(u.title)}</b><p>${hesc(u.body)}</p></div>`:'')+
 `<h1>${hesc(HD.home.title||'')}</h1><div id="hhero">${slides.length?slides.map((x,i)=>`<div class="hsl${i?'':' on'}" style="background-image:${hcss(x.src)}">${x.cap?`<i>${hesc(x.cap)}</i>`:''}</div>`).join('')+`<div class="hdots">${slides.map((_,i)=>`<b class="${i?'':'on'}" data-i="${i}"></b>`).join('')}</div>`:'<div class="hempty">لا توجد صور للعرض بعد</div>'}</div>`+
 `<h2>الخدمات</h2><div id="hgrid">${sv.length?sv.map(x=>{const md=x.mode||'both',bg=Store.img(HD,x.bg),link=x.kind==='link';
  return `<a class="hcard ${md}" ${link?`href="${hesc(hurl(x.url))}" target="_blank" rel="noopener" data-hs="${hesc(x.id)}"`:`href="#s=${hesc(x.id)}"`} style="${bg?`background-image:${hcss(bg)}`:''}">${md!=='text'?`<span class="hic">${hesc(x.icon||'')}</span>`:''}${md!=='icon'?`<b>${hesc(x.title||'خدمة')}</b>`:''}</a>`}).join(''):'<div class="hglass hempty" style="grid-column:1/-1;padding:28px">لا توجد خدمات بعد</div>'}</div>`+
 (nt.length?`<h2>الإشعارات</h2>`+nt.map(n=>`<div class="hglass hnote">${n.title?`<b>${hesc(n.title)}</b>`:''}<p>${hesc(n.body)}</p><small>${hdate(n.date)}</small></div>`).join(''):'');
 if(slides.length>1){
  const go=n=>{const sl=document.querySelectorAll('.hsl'),dt=document.querySelectorAll('.hdots b');if(!sl.length)return;sl[hcur].classList.remove('on');dt[hcur].classList.remove('on');hcur=(n+slides.length)%slides.length;sl[hcur].classList.add('on');dt[hcur].classList.add('on')};
  const start=()=>{clearInterval(htimer);htimer=setInterval(()=>go(hcur+1),Math.max(2,+HD.home.interval||5)*1000)};
  start();const h=hq('#hhero');let x0=null;
  h.onpointerdown=e=>{x0=e.clientX};
  h.onpointerup=e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40){go(hcur+(dx<0?1:-1));start()}};
  h.onclick=e=>{const b=e.target.closest('.hdots b');if(b){go(+b.dataset.i);start()}};
 }
}
function hservice(s){
 hq('#hbg').style.backgroundImage='';
 const bg=Store.img(HD,s.bg);
 const blocks=(s.blocks||[]).map(b=>{
  if(b.type==='text'&&b.text)return`<div class="hblk hglass htxt">${hesc(b.text)}</div>`;
  if(b.type==='image'&&Store.img(HD,b.img))return`<div class="hblk"><img class="hpic" src="${Store.img(HD,b.img)}" alt=""></div>`;
  if(b.type==='location'&&b.url)return`<div class="hblk"><a class="hbtn" target="_blank" rel="noopener" href="${hesc(hmap(b.url))}">${hesc(b.label||'الموقع')}</a></div>`;
  if(b.type==='link'&&b.url)return`<div class="hblk"><a class="hbtn" target="_blank" rel="noopener" href="${hesc(hurl(b.url))}">${hesc(b.label||'فتح الرابط')}</a></div>`;
  return''}).join('');
 hq('#happ').innerHTML=`<div class="htop" style="${bg?`background-image:${hcss(bg)}`:''}"><button class="hback" id="hbk">→</button><h1>${hesc(s.icon||'')} ${hesc(s.title||'')}</h1></div>${blocks||'<div class="hblk hglass hempty" style="padding:28px">لا توجد تفاصيل بعد</div>'}`;
 hq('#hbk').onclick=()=>{location.hash=''};hq('#happ').scrollTop=0;
 castSvc(s.title,s.dlg);
}
hq('#happ').addEventListener('click',e=>{
 const i=e.target.closest('.hpic');if(i){hq('#hlb').innerHTML=`<img src="${i.src}">`;hq('#hlb').style.display='flex';return}
 const x=e.target.closest('[data-hx]');if(x){try{localStorage.setItem('b25u',x.dataset.hx)}catch(z){}hsig='';hrender();return}
 const c=e.target.closest('[data-hs]');if(c){const s=Store.load().services.find(v=>v.id==c.dataset.hs);if(s)castSvc(s.title,s.dlg)}});
hq('#hlb').onclick=()=>{hq('#hlb').style.display='none'};
addEventListener('hashchange',hrender);
hrender();
Store.init().then(()=>{hrender();applyDialogs()});
setInterval(()=>Store.init().then(()=>{hrender();applyDialogs()}),45000);

$('#start').addEventListener('pointerdown',intro,{once:true});
